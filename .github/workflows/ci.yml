name: Robot Framework CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: docker build -t demo-tests .

      # 3. Run the tests
      - name: Run tests
        run: |
          docker run --rm \
            -e EMAIL=testuser@example.com \
            -e PASSWORD=secret123 \
            -e BASEURL=https://mybank-8s6n.onrender.com \
            demo-tests

      # 4. Upload results
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: results/